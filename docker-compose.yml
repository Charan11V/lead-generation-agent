# Frequency lead agent — shared base (no host ports).
# Local:  docker compose up          → also loads docker-compose.override.yml
# Prod:   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

name: frequency-lead-agent

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: frequency-lead-agent:latest
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8501"
      FREQUENCY_DB_PATH: /app/var/frequency_agent.db
    expose:
      - "8501"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/_stcore/health' % os.environ.get('PORT','8501'))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - frequency

networks:
  frequency:
    driver: bridge
